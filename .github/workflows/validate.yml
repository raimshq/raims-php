name: Validate PHP SDK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: raims-php-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: '1'
  RAIMS_PHP_TOOLKIT_REF: d1257827c06210275b9edb955fb1611fed41b4b5

jobs:
  validatePhp:
    name: validatePhp (${{ matrix.php }})
    if: github.repository == 'raimshq/raims-php'
    runs-on:
      - codebuild-raims-github-actions-${{ github.run_id }}-${{ github.run_attempt }}
      - php-sdk-check-${{ matrix.php }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        include:
          - php: '8.2'
            php_version: '8.2.36'
          - php: '8.3'
            php_version: '8.3.37'
          - php: '8.4'
            php_version: '8.4.28'
          - php: '8.5'
            php_version: '8.5.13'
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout the candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          path: Raims-PHP
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.14'

      - name: Reject tracked files excluded by repository policy
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys

          checkout = Path(os.environ['GITHUB_WORKSPACE']) / 'Raims-PHP'
          ignored = subprocess.check_output([
              'git', '-C', str(checkout), 'ls-files', '--cached', '--ignored',
              '--exclude-from=.gitignore', '-z',
          ])
          count = sum(bool(path) for path in ignored.split(b'\0'))
          if count:
              print(f'Repository policy rejects {count} tracked ignored file(s). Remove them from Git tracking before publishing.', file=sys.stderr)
              raise SystemExit(1)
          PY

      - name: Prepare PHP tool selection
        run: |
          python - <<'PY'
          import os
          from pathlib import PurePosixPath

          paths = [
              path for path in os.environ['PATH'].split(':')
              if not (
                  PurePosixPath(path).name in {'shims', 'bin'}
                  and PurePosixPath(path).parent.name == '.phpenv'
              )
          ]
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as environment:
              environment.write('PATH=' + ':'.join(paths) + '\n')
          PY

      - name: Setup PHP and Composer
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php_version }}
          extensions: curl, hash, json
          tools: composer:2.11.0
          coverage: none

      - name: Create a read-only validation source token
        id: sources
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.RAIMS_CI_SOURCE_READER_CLIENT_ID }}
          private-key: ${{ secrets.RAIMS_CI_SOURCE_READER_PRIVATE_KEY }}
          owner: raimshq
          repositories: Raims-Developer-Toolkit
          permission-contents: read

      - name: Checkout the reviewed validation tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: raimshq/Raims-Developer-Toolkit
          ref: ${{ env.RAIMS_PHP_TOOLKIT_REF }}
          path: Developer-Toolkit
          token: ${{ steps.sources.outputs.token }}
          persist-credentials: false

      - name: Run the canonical PHP SDK checks
        run: |
          set -euo pipefail
          cp Developer-Toolkit/internal/public-repositories/workspace/AGENTS.md AGENTS.md
          command -v php
          actual_php_version="$(php -r 'echo PHP_VERSION;')"
          printf 'PHP runtime: %s; expected: %s\n' "$actual_php_version" '${{ matrix.php_version }}'
          test "$actual_php_version" = '${{ matrix.php_version }}'
          python Developer-Toolkit/scripts/release-preflight/php_sdk.py \
            --source "$GITHUB_WORKSPACE/Raims-PHP" \
            --workspace "$GITHUB_WORKSPACE" \
            --output "$GITHUB_WORKSPACE/.tmp/raims-php-sdk/validate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-${{ matrix.php }}" \
            --expected-php-version '${{ matrix.php_version }}' \
            --prepare-tools

      - name: Bind the PHP 8.2 public archives to the validation attempt
        if: matrix.php == '8.2'
        run: |
          python Raims-PHP/scripts/release.py capture-validation \
            --source Raims-PHP \
            --report ".tmp/raims-php-sdk/validate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-8.2/report.json" \
            --artifact ".tmp/raims-php-sdk/validate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-8.2/evidence" \
            --php-version '${{ matrix.php_version }}'

      - name: Preserve the PHP 8.2 public archive evidence
        if: matrix.php == '8.2'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: raims-php-validation-${{ github.run_id }}-${{ github.run_attempt }}-8.2
          path: .tmp/raims-php-sdk/validate-${{ github.run_id }}-${{ github.run_attempt }}-8.2/evidence/validation-evidence.json
          if-no-files-found: error
          retention-days: 14

  securityLinux:
    name: securityLinux
    if: github.repository == 'raimshq/raims-php'
    runs-on:
      - codebuild-raims-github-actions-${{ github.run_id }}-${{ github.run_attempt }}
      - php-sdk-security
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout the candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          path: Raims-PHP
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.14'

      - name: Reject tracked files excluded by repository policy
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys

          checkout = Path(os.environ['GITHUB_WORKSPACE']) / 'Raims-PHP'
          ignored = subprocess.check_output([
              'git', '-C', str(checkout), 'ls-files', '--cached', '--ignored',
              '--exclude-from=.gitignore', '-z',
          ])
          count = sum(bool(path) for path in ignored.split(b'\0'))
          if count:
              print(f'Repository policy rejects {count} tracked ignored file(s). Remove them from Git tracking before publishing.', file=sys.stderr)
              raise SystemExit(1)
          PY

      - name: Create a read-only validation source token
        id: sources
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.RAIMS_CI_SOURCE_READER_CLIENT_ID }}
          private-key: ${{ secrets.RAIMS_CI_SOURCE_READER_PRIVATE_KEY }}
          owner: raimshq
          repositories: Raims-Developer-Toolkit
          permission-contents: read

      - name: Checkout the reviewed validation tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: raimshq/Raims-Developer-Toolkit
          ref: ${{ env.RAIMS_PHP_TOOLKIT_REF }}
          path: Developer-Toolkit
          token: ${{ steps.sources.outputs.token }}
          persist-credentials: false

      - name: Run the canonical security gate
        run: |
          set -euo pipefail
          cp Developer-Toolkit/internal/public-repositories/workspace/AGENTS.md AGENTS.md
          python Developer-Toolkit/scripts/release-preflight/sdk_security.py \
            --source "$GITHUB_WORKSPACE/Raims-PHP" \
            --workspace "$GITHUB_WORKSPACE" \
            --repository Raims-PHP \
            --output "$GITHUB_WORKSPACE/.tmp/raims-php-sdk/security-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --prepare-tools
